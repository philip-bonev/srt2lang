[package]
name = "srt2lang"
version = "1.1.0"
edition = "2024"
rust-version = "1.99"
description = "Console tool that translates English SRT subtitles into another language via an OpenAI-compatible LLM endpoint"

[dependencies]
iso639 = "0.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
